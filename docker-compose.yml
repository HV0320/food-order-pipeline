services:
  postgres:
    image: postgres:16
    container_name: food_order_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: food_order_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    container_name: food_order_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STREAM_NAME: ${STREAM_NAME:-order.workflow}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-order.dead_letter}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-order-workers}
      RESTAURANT_BASE_URL: ${RESTAURANT_BASE_URL:-http://restaurant-sim:8001}
      COURIER_BASE_URL: ${COURIER_BASE_URL:-http://courier-sim:8002}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurant-sim:
    build: ./services/restaurant-sim
    container_name: food_order_restaurant_sim
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/restaurant/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  courier-sim:
    build: ./services/courier-sim
    container_name: food_order_courier_sim
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/courier/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-relay:
    build: ./services/outbox-relay
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STREAM_NAME: ${STREAM_NAME:-order.workflow}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STREAM_NAME: ${STREAM_NAME:-order.workflow}
      DEAD_LETTER_STREAM: ${DEAD_LETTER_STREAM:-order.dead_letter}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-order-workers}
      RESTAURANT_BASE_URL: ${RESTAURANT_BASE_URL:-http://restaurant-sim:8001}
      COURIER_BASE_URL: ${COURIER_BASE_URL:-http://courier-sim:8002}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      WORKER_REQUEST_TIMEOUT_SECONDS: ${WORKER_REQUEST_TIMEOUT_SECONDS:-3}
      PENDING_IDLE_MS: ${PENDING_IDLE_MS:-15000}
      PENDING_CHECK_INTERVAL_SECONDS: ${PENDING_CHECK_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      restaurant-sim:
        condition: service_healthy
      courier-sim:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    container_name: food_order_frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  loadgen:
    build: ./services/loadgen
    container_name: food_order_loadgen
    ports:
      - "8089:8089"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss
    container_name: food_order_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  grafana_data:
