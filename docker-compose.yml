services:
  postgres:
    image: postgres:16
    container_name: food_order_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: food_order_valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    container_name: food_order_api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-relay:
    build: ./services/outbox-relay
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STREAM_NAME: order.workflow
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orders:orders@postgres:5432/orders}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      STREAM_NAME: order.workflow
      CONSUMER_GROUP: order-workers
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
